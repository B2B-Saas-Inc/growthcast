name: Portal foundation verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch exact upstream schema source
        run: |
          git init /tmp/atrium-foundation
          git -C /tmp/atrium-foundation remote add upstream https://github.com/Vibra-Labs/Atrium.git
          git -C /tmp/atrium-foundation fetch --depth=1 upstream 1a94a30b9aabe0e2d444c9239c4898d18b0dd5e2
          git -C /tmp/atrium-foundation checkout --detach FETCH_HEAD
      - name: Build and verify migrations, permissions and recovery in containers
        run: sh portal/foundation/run.sh /tmp/atrium-foundation
      - name: Verify managed private-schema Atrium baseline and recovery
        run: sh portal/deployment/supabase/managed-atrium/run.sh
      - name: Verify isolated API, mounted credentials and captured SMTP
        run: sh portal/atrium-spike/run.sh /tmp/atrium-foundation
      - name: Validate selected deployment configuration and Supabase isolation
        run: sh portal/deployment/check.sh
