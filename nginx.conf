server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://*.posthog.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://cloudflareinsights.com https://*.posthog.com; worker-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location ~ ^/gcast-io/(static|array)/(.*)$ {
    proxy_ssl_server_name on;
    proxy_set_header Host us-assets.i.posthog.com;
    proxy_pass https://us-assets.i.posthog.com/$1/$2$is_args$args;
  }

  location /gcast-io/ {
    proxy_ssl_server_name on;
    proxy_set_header Host us.i.posthog.com;
    proxy_pass https://us.i.posthog.com/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
