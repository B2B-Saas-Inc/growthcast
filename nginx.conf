server {
  listen 8080;
  server_name localhost;
  absolute_redirect off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location ~ ^/gcast-io/(static|array)/(.*)$ {
    proxy_ssl_server_name on;
    proxy_set_header Host us-assets.i.posthog.com;
    proxy_pass https://us-assets.i.posthog.com/$1/$2$is_args$args;
  }

  location /gcast-io/ {
    proxy_ssl_server_name on;
    proxy_set_header Host us.i.posthog.com;
    proxy_pass https://us.i.posthog.com/;
  }

  location / {
    try_files $uri $uri/ $uri.html /404.html;
  }
}
