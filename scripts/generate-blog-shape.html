<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GrowthCast article artwork generator</title>
    <style>html,body{margin:0;width:560px;height:420px;overflow:hidden;background:#f4f1e9}canvas{display:block}</style>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.0.5/lib/p5.min.js"></script>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const variant = Number(params.get('variant') || 0);
      const basePalette = ['#a63820', '#176c2c', '#2874a6', '#e2a83b'];
      const palette = basePalette.map((_, index) => basePalette[(index + variant) % basePalette.length]);

      function setup() {
        createCanvas(560, 420);
        pixelDensity(1);
        randomSeed(260903 + variant * 97);
        noiseSeed(260903 + variant * 97);
        background('#f4f1e9');

        noFill();
        strokeCap(ROUND);
        strokeJoin(ROUND);

        // Source signals move through bounded automation and a human review gate.
        for (let lane = 0; lane < 4; lane += 1) {
          const y = 92 + lane * 78;
          const color = palette[lane];
          for (let echo = 0; echo < 5; echo += 1) {
            stroke(color + (echo === 0 ? 'dc' : '2b'));
            strokeWeight(echo === 0 ? 5 : 1.25);
            beginShape();
            for (let step = 0; step <= 72; step += 1) {
              const t = step / 72;
              const x = 42 + t * 445;
              const bend = sin(t * PI * (2 + (variant % 3) * 0.35) + lane * 0.7 + variant) * (10 - echo);
              const merge = lerp(y, 190 + (variant % 5) * 10, pow(t, 1.55 + (variant % 4) * 0.12));
              vertex(x, merge + bend + echo * 3 - 6);
            }
            endShape();
          }
        }

        // Input records.
        noStroke();
        palette.forEach((color, index) => {
          fill(color); circle(42, 92 + index * 78, 14);
          fill(color + '24'); circle(72, 92 + index * 78, 26);
        });

        // Control gates.
        noFill(); stroke('#242426'); strokeWeight(2);
        const gateShift = (variant % 4) * 8;
        rect(198 + gateShift, 52, 72, 316, 28);
        rect(326 + gateShift, 76, 72, 268, 28);
        line(234 + gateShift, 72, 234 + gateShift, 348);
        line(362 + gateShift, 96, 362 + gateShift, 324);

        // Human approval point and released action.
        fill('#f4f1e9'); stroke('#242426'); strokeWeight(4); circle(486, 210, 76);
        noStroke(); fill('#242426'); circle(474, 198, 8); circle(498, 198, 8);
        noFill(); stroke('#242426'); strokeWeight(3); arc(486, 211, 34, 28, 0.18, PI - 0.18);
        stroke('#176c2c'); strokeWeight(5); line(524, 210, 548, 210);
      }
    </script>
  </body>
</html>
