services:
  prepare:
    image: growthcast-recovery
    user: root
    network_mode: none
    entrypoint: [sh, -ec]
    command: ["chmod 777 /snapshot /encrypted /restored; node archive.mjs key"]
    volumes: ["recovery-key:/key", "snapshot:/snapshot", "recovery-encrypted:/encrypted", "restored:/restored"]
  capture:
    image: growthcast-managed-recovery
    command: [/app/deployment/managed-recovery/capture.mjs]
    volumes:
      - "../:/app/deployment:ro"
      - "${PORTAL_STAGING_SECRETS:?Protected staging folder required}/database-url:/source/database-url:ro"
      - "${PORTAL_STAGING_SECRETS}/prod-ca-2021.crt:/source/prod-ca-2021.crt:ro"
      - "${PORTAL_STAGING_SECRETS}/storage-credentials.json:/source/storage-credentials.json:ro"
      - snapshot:/snapshot
      - journal:/journal:ro
    networks: [source-egress]
  prepare-source:
    image: growthcast-managed-recovery
    command: [/app/deployment/managed-recovery/prepare-source.mjs]
    volumes:
      - "../:/app/deployment:ro"
      - "${PORTAL_STAGING_SECRETS}/storage-credentials.json:/source/storage-credentials.json:ro"
      - journal:/journal
    networks: [source-egress]
  cleanup-source:
    image: growthcast-managed-recovery
    command: [/app/deployment/managed-recovery/cleanup.mjs]
    volumes:
      - "../:/app/deployment:ro"
      - "${PORTAL_STAGING_SECRETS}/storage-credentials.json:/source/storage-credentials.json:ro"
      - journal:/journal:ro
    networks: [source-egress]
  encrypt:
    image: growthcast-recovery
    command: [node, archive.mjs, encrypt]
    network_mode: none
    volumes: ["recovery-key:/key:ro", "snapshot:/snapshot:ro", "recovery-encrypted:/encrypted"]
  decrypt:
    image: growthcast-recovery
    command: [node, archive.mjs, decrypt]
    network_mode: none
    volumes: ["recovery-key:/key:ro", "recovery-encrypted:/encrypted:ro", "restored:/restored"]
  target:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment: {POSTGRES_HOST_AUTH_METHOD: trust}
    networks: [restore]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      retries: 30
  restore:
    image: growthcast-managed-recovery
    entrypoint: [sh, /app/deployment/managed-recovery/restore.sh]
    volumes: ["../:/app/deployment:ro", "restored:/restored", "objects:/objects"]
    networks: [restore]
  verify:
    image: growthcast-managed-recovery
    command: [/app/deployment/managed-recovery/verify.mjs]
    volumes: ["../:/app/deployment:ro", "restored:/restored:ro", "objects:/objects:ro"]
    networks: [restore]
networks:
  source-egress: {}
  restore: {internal: true}
volumes:
  recovery-key:
  recovery-encrypted:
  snapshot:
  restored:
  journal:
  objects:
