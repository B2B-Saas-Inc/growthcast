# Opt-in non-synthetic capture. No fixture writer, journal or administrator mount.
services:
  capture:
    command: [/app/deployment/backup/capture.mjs]
    volumes: !override
      - "../:/app/deployment:ro"
      - "${PORTAL_STAGING_SECRETS:?Protected staging folder required}/backup-database-url:/source/database-url:ro"
      - "${PORTAL_STAGING_SECRETS}/prod-ca-2021.crt:/source/prod-ca-2021.crt:ro"
      - "${PORTAL_STAGING_SECRETS}/backup-storage-credentials.json:/source/storage-credentials.json:ro"
      - snapshot:/snapshot
