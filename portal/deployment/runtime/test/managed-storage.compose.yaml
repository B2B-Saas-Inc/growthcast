# Explicit live staging storage opt-in. Database and SMTP remain disposable/local.
services:
  prepare:
    environment:
      RUNTIME_MANAGED_STORAGE: '1'
    volumes:
      - "${PORTAL_STORAGE_CREDENTIAL_FILE:?Scoped credential file required}:/input/storage-credentials.json:ro"
      - managed-storage:/managed-storage
  provider:
    volumes: ["managed-storage:/run/storage:ro"]
    networks: [private, storage-egress]
  storage-cleanup:
    image: growthcast-atrium-runtime
    entrypoint: [bun, /fixture/managed-storage-cleanup.mjs]
    volumes: ["./:/fixture:ro", "managed-storage:/run/storage:ro", "auth-evidence:/evidence:ro"]
    networks: [storage-egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [test]
networks:
  storage-egress: {}
volumes:
  managed-storage:
