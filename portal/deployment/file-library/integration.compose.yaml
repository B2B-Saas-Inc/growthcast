services:
  prepare:
    image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
  setup:
    image: growthcast-foundation
    user: root
    entrypoint: [sh, -c, 'ln -s /foundation/node_modules /app/node_modules; exec node /app/deployment/runtime/test/database.mjs "$@"', sh]
  library-check:
    image: growthcast-foundation
    user: root
    entrypoint: [node, /foundation/library/integration.check.mjs]
    volumes: ['${LIBRARY_ROOT}:/foundation/library:ro', 'runtime:/runtime:ro', 'origin:/origin:ro', 'auth-evidence:/auth:ro', '${LIBRARY_EVIDENCE_FILE}:/evidence.json']
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ['no-new-privileges:true']
  migration-check:
    image: growthcast-foundation
    user: root
    entrypoint: [node, /foundation/library/migration.check.mjs]
    volumes: ['${LIBRARY_ROOT}:/foundation/library:ro', 'runtime:/runtime:ro', 'admin:/admin:ro']
    networks: [private]
