services:
  recovery-snapshot:
    volumes:
      - ${MANAGED_DOCUMENSO_ROOT}/recovery/snapshot.sh:/fixture/snapshot.sh:ro
  recovery-restore:
    volumes:
      - ${MANAGED_DOCUMENSO_ROOT}/recovery/restore.sh:/fixture/restore.sh:ro
      - ${MANAGED_DOCUMENSO_ROOT}/../isolation.sql:/fixture/isolation.sql:ro
  recovery-verify:
    volumes:
      - ${MANAGED_DOCUMENSO_ROOT}/recovery/verify.mjs:/recovery/verify.mjs:ro
      - ${MANAGED_DOCUMENSO_ROOT}:/managed:ro
