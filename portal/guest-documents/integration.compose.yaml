services:
  prepare:
    image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
  setup:
    image: growthcast-foundation
    user: root
    entrypoint: [sh, -c, 'ln -s /foundation/node_modules /app/node_modules; exec node /app/deployment/runtime/test/database.mjs "$@"', sh]
  connector-check:
    image: growthcast-foundation
    user: root
    entrypoint: [node, /foundation/guest/integration.check.mjs]
    volumes: ['${GUEST_WORKFLOW_ROOT}:/foundation/guest:ro', '${GUEST_WORKFLOW_ROOT}/../deployment/storage:/foundation/storage:ro', 'runtime:/runtime:ro', 'origin:/origin:ro', 'auth-evidence:/auth:ro', '${GUEST_EVIDENCE_FILE}:/evidence.json', '${GUEST_CONNECTOR_INPUT}:/connector:ro']
    networks: [private, connector-egress]
    read_only: true
    cap_drop: [ALL]
    # Fixture driver reads UID-owned synthetic credentials through read-only mounts.
    cap_add: [DAC_OVERRIDE]
    security_opt: ['no-new-privileges:true']
networks:
  connector-egress: {}
