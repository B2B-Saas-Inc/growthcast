services:
  delivery-mail:
    image: maildev/maildev:2.0.5@sha256:082ec5ee92266c6e17493998ff1bf1c3eb70604b159fbeeaa435ee777f5cc953
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:1080/healthz || exit 1']
      interval: 2s
      timeout: 2s
      retries: 30
  delivery-migrate:
    image: growthcast-guest-delivery
    command: [node, /foundation/guest/signing/delivery.check.mjs, migrate]
    environment: {DB_ROLE: gc_migrate}
    volumes: [migrate:/credential:ro, ca:/ca:ro, '${GUEST_WORKFLOW_ROOT}:/foundation/guest:ro']
    networks: [private]
  delivery-check:
    image: growthcast-guest-delivery
    command: [node, /foundation/guest/signing/delivery.check.mjs, check]
    environment: {DB_ROLE: gc_app}
    volumes: [app:/credential:ro, lifecycle:/lifecycle:ro, gateway-credentials:/gateway-credential:ro, ca:/ca:ro, '${GUEST_WORKFLOW_ROOT}:/foundation/guest:ro', '${GUEST_DELIVERY_EVIDENCE}:/delivery-evidence.json']
    networks: [private]
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
