services:
  prepare:
    image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
  setup:
    image: growthcast-foundation
    user: root
    entrypoint: [sh, -c, 'ln -s /foundation/node_modules /app/node_modules; exec node /app/deployment/runtime/test/database.mjs "$@"', sh]
  web:
    image: growthcast-guest-web
  ingress:
    entrypoint: [node,/foundation/guest/web/fixture-proxy.mjs]
    volumes: ['${GUEST_WORKFLOW_ROOT}:/foundation/guest:ro']
  guest-seed:
    image: growthcast-foundation
    user: root
    entrypoint: [node,/foundation/guest/web/fixture.mjs]
    volumes: ['${GUEST_WORKFLOW_ROOT}:/foundation/guest:ro','runtime:/runtime:ro','admin:/admin:ro','auth-evidence:/auth:ro','pdf-fixtures:/pdf-fixtures']
    networks: [private]
  guest:
    image: growthcast-guest-delivery
    user: root
    entrypoint: [node,/foundation/guest/web/fixture-server.mjs]
    volumes: ['${GUEST_WORKFLOW_ROOT}:/foundation/guest:ro','runtime:/runtime:ro','origin:/origin:ro','tls:/tls:ro']
    networks: [private]
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    environment:
      NODE_EXTRA_CA_CERTS: /tls/web.crt
  browser:
    volumes: ['pdf-fixtures:/pdf-fixtures:ro']

volumes:
  pdf-fixtures:
