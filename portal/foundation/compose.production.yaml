# Intentionally preflight-only: no application ingress or production resources.
services:
  release-preflight:
    image: ${FOUNDATION_IMAGE:?Reviewed immutable foundation image required}
    command: [node, release-check.mjs]
    environment:
      PORTAL_ENV: production
      WEB_URL: ${WEB_URL:?}
      API_URL: ${API_URL:?}
      GATEWAY_ORIGIN: ${GATEWAY_ORIGIN:?}
      ALLOW_SIGNUPS: 'false'
      SECURE_COOKIES: 'true'
    volumes: [./release.json:/foundation/release.json:ro]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
