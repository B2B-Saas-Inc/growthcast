name: growthcast-gateway-spike
services:
  database:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: documenso_test
    networks: [private]
    volumes:
      - database:/var/lib/postgresql/data
      - ./test/init.sql:/docker-entrypoint-initdb.d/gateway.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d documenso_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  mail:
    image: maildev/maildev:2.0.5@sha256:082ec5ee92266c6e17493998ff1bf1c3eb70604b159fbeeaa435ee777f5cc953
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:1080/healthz || exit 1"]
  prepare:
    image: &documenso documenso/documenso@sha256:615d0e79047ff9615dc86092bf9a6ba021750ee3895f440621e94477b581b183
    platform: linux/arm64
    user: root
    entrypoint: [sh, /fixture/prepare.sh]
    networks: [private]
    volumes:
      - runtime:/runtime
      - ./test:/fixture:ro
  migrate:
    image: *documenso
    platform: linux/arm64
    entrypoint: [sh, -ec, "./node_modules/.bin/prisma migrate deploy --schema packages/prisma/schema.prisma"]
    working_dir: /app
    environment: &docenv
      NEXT_PRIVATE_DATABASE_URL: postgresql://postgres@database:5432/documenso_test
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://postgres@database:5432/documenso_test
    depends_on:
      database: { condition: service_healthy }
    networks: [private]
  documenso:
    image: *documenso
    platform: linux/arm64
    entrypoint: [node, build/server/main.js]
    environment:
      <<: *docenv
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXTAUTH_SECRET: synthetic-local-test-only-not-a-production-secret
      NEXT_PRIVATE_ENCRYPTION_KEY: synthetic-local-test-primary
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: synthetic-local-test-secondary
      NEXT_PUBLIC_WEBAPP_URL: https://signing.growthcast.test:8443
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://documenso:3000
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: mail
      NEXT_PRIVATE_SMTP_PORT: 1025
      NEXT_PRIVATE_SMTP_SECURE: "false"
      NEXT_PRIVATE_SMTP_FROM_NAME: GrowthCast Local Test
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: test@growthcast.invalid
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /runtime/test-cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ""
      NEXT_PRIVATE_JOBS_PROVIDER: local
      NEXT_PUBLIC_DISABLE_SIGNUP: "true"
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
      DOCUMENSO_DISABLE_TELEMETRY: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
      prepare: { condition: service_completed_successfully }
      mail: { condition: service_started }
    volumes: [runtime:/runtime:ro]
    networks: [private]
    mem_limit: 2g
    cpus: 2
    # Upstream logs contain bearer tokens. Discard raw logs in this disposable
    # spike; a redacting production collector is a separate release prerequisite.
    logging:
      driver: none
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 45
  gateway:
    build: .
    environment:
      GATEWAY_RUN: local-test
      DATABASE_URL: postgresql://postgres@database:5432/gateway_test
      GATEWAY_ORIGIN: https://signing.growthcast.test:8443
      UV_THREADPOOL_SIZE: 2
      NODE_OPTIONS: --max-old-space-size=96
    volumes: [runtime:/runtime:ro]
    networks:
      private: {}
      edge:
        aliases: [signing.growthcast.test]
    # Browser validation runs on the isolated edge network. No host ports.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    depends_on:
      prepare: { condition: service_completed_successfully }
      database: { condition: service_healthy }
  seed:
    image: *documenso
    platform: linux/arm64
    entrypoint: [node, /fixture/seed-provider.cjs]
    environment: *docenv
    networks: [private]
    volumes:
      - runtime:/runtime
      - ./test:/fixture:ro
    profiles: [test]
  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    networks: [edge]
    volumes: [runtime:/runtime]
    profiles: [test]
    shm_size: 256m
  sdk:
    build: ./sdk
    volumes: [runtime:/runtime:ro]
    networks:
      edge:
        aliases: [portal.growthcast.test, untrusted.growthcast.test]
    depends_on:
      prepare: { condition: service_completed_successfully }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  test:
    build: .
    command: [npm, test]
    environment:
      DATABASE_URL: postgresql://postgres@database:5432/gateway_test
    networks: [private]
    volumes: [runtime:/runtime]
    profiles: [test]
    depends_on:
      database: { condition: service_healthy }
networks:
  private:
    internal: true
  edge:
    internal: true
volumes:
  database:
  runtime:
